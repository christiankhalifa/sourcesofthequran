<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Intertextual Qur’an Project — 200 Years of Collated Sources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- palette from index_ini.html ---- */
  --paper:#faf8f3; --surface:#fdfbf6; --surface-raised:#ffffff;
  --ink:#1a1814; --ink-muted:#5a554c; --ink-soft:#8a847a;
  --rule:#d6cfc1; --rule-soft:#ebe5d6;
  --accent:#8b2e2e; --accent-soft:#c89393; --gold:#a6854a; --highlight:#f1e9c9;
  --trad-biblical:#3a5a40; --trad-jewish:#5b3c11; --trad-christian:#4e4187;
  --shadow-sm:0 1px 2px rgba(26,24,20,0.06);
  --shadow-md:0 4px 14px rgba(26,24,20,0.08);
  --shadow-lg:0 12px 36px rgba(26,24,20,0.12);

  /* ---- names the page script relies on, mapped onto that palette ---- */
  --paper-2:var(--rule-soft); --line:var(--rule); --muted:var(--ink-muted);
  --quran:var(--gold); --bible:var(--trad-biblical); --jewish:var(--trad-jewish); --christian:var(--trad-christian); --other:var(--ink-soft);
  --quran-tint:rgba(166,133,74,0.07); --bible-tint:rgba(58,90,64,0.08);
  --jewish-tint:rgba(91,60,17,0.07); --christian-tint:rgba(78,65,135,0.07);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:var(--shadow-md);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--serif);
  font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100vh;
}
button,input,select{font-family:inherit;color:inherit}
a{color:var(--accent)}
::selection{background:var(--highlight)}

/* ---------- Header (ini .topbar) ---------- */
header{
  border-bottom:1px solid var(--rule); background:rgba(250,248,243,0.95);
  backdrop-filter:blur(8px); position:sticky; top:0; z-index:40;
}
.head-row{display:flex; align-items:center; gap:1.25rem; padding:0.75rem 1.5rem}
.brand{display:flex; align-items:baseline; gap:12px; min-width:0}
.mark{font-family:var(--serif); font-weight:600; font-size:1.2rem; letter-spacing:0.02em; white-space:nowrap; color:var(--ink)}
.mark .of{font-style:italic; font-weight:400; color:var(--accent)}
.tagline{font-family:var(--serif); font-style:italic; font-size:0.95rem; color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.head-tools{margin-left:auto; display:flex; align-items:center; gap:10px}
.search{position:relative; display:flex; align-items:center}
.search input{
  font-family:var(--sans); font-size:0.8rem; color:var(--ink);
  background:var(--surface-raised); border:1px solid var(--rule); border-radius:2px;
  padding:0.45rem 0.7rem 0.45rem 1.9rem; width:230px; outline:none; transition:border-color .15s;
}
.search input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(139,46,46,0.08)}
.search svg{position:absolute; left:0.6rem; width:14px; height:14px; color:var(--ink-soft)}
.status{
  font-family:var(--mono); font-size:0.72rem; color:var(--ink-soft);
  text-transform:uppercase; letter-spacing:0.08em;
  display:flex; align-items:center; gap:6px; white-space:nowrap;
}
.dot{width:6px; height:6px; border-radius:50%; background:var(--ink-soft); flex:none}
.dot.live{background:var(--trad-biblical)}
.dot.err{background:var(--accent)}
.btn{
  font-family:var(--sans); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.08em;
  padding:0.4rem 0.8rem; background:transparent; border:1px solid var(--rule); border-radius:2px;
  cursor:pointer; color:var(--ink-muted); white-space:nowrap; transition:all .15s;
}
.btn:hover{border-color:var(--ink); color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- Shell / sidebar (ini .sidebar) ---------- */
.shell{display:flex; flex:1; min-height:0}
aside{
  width:300px; flex:none; border-right:1px solid var(--rule);
  background:var(--surface); display:flex; flex-direction:column; min-height:0;
  font-family:var(--sans);
}
.modes{display:flex; padding:1rem 0.9rem 0; gap:2px}
.mode{
  flex:1; text-align:center; font-family:var(--sans); font-size:0.7rem; font-weight:600;
  text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); background:none;
  padding:0.6rem 0.2rem 0.55rem; border:0; border-bottom:2px solid transparent;
  cursor:pointer; line-height:1.3; transition:all .12s;
}
.mode small{display:block; font-family:var(--serif); font-size:0.82rem; font-weight:400; font-style:italic; text-transform:none; letter-spacing:0; margin-top:2px}
.mode:hover{color:var(--ink)}
.mode[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.mode:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.browse{flex:1; overflow:auto; background:var(--surface); border-top:1px solid var(--rule); padding:0.5rem 0.6rem 2rem}
.crumbtop{
  font-family:var(--sans); font-size:0.68rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--ink-soft); padding:1.1rem 0.6rem 0.4rem;
}
.nav-item{
  display:flex; align-items:baseline; gap:0.5rem; width:100%; text-align:left;
  background:none; border:0; border-left:2px solid transparent; border-radius:2px;
  font-family:var(--sans); font-size:0.84rem; font-weight:500; color:var(--ink-muted);
  padding:0.45rem 0.7rem; cursor:pointer; line-height:1.3; transition:all .12s;
}
.nav-item:hover{background:var(--rule-soft); color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--rule-soft); color:var(--ink); font-weight:600; border-left-color:var(--accent)}
.nav-item:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.nav-item .lead{font-family:var(--mono); font-size:0.72rem; font-weight:500; color:var(--gold); flex:none; min-width:30px}
.nav-item .count{margin-left:auto; font-family:var(--mono); font-size:0.7rem; font-weight:400; color:var(--ink-soft); flex:none}
.nav-group{
  font-family:var(--serif); font-size:1.05rem; font-weight:600; color:var(--ink);
  padding:0.85rem 0.6rem 0.3rem; border-top:1px solid var(--rule-soft); margin-top:0.35rem;
}
.nav-group:first-child{border-top:none; margin-top:0}
.nav-sub{
  font-family:var(--sans); font-size:0.66rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--ink-soft); padding:0.6rem 0.7rem 0.2rem;
}
.back{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--sans); font-size:0.72rem;
  text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-muted);
  background:none; border:none; cursor:pointer; padding:0.7rem 0.6rem 0.3rem;
}
.back:hover{color:var(--accent)}

/* ---------- Main ---------- */
main{flex:1; overflow:auto; min-width:0}
.wrap{max-width:1400px; margin:0 auto; padding:2rem 3rem 4rem}
.crumb{
  font-family:var(--mono); font-size:0.72rem; color:var(--ink-soft); letter-spacing:0.04em;
  display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:0.9rem;
}
.crumb b{color:var(--gold); font-weight:500}
.crumb .sep{opacity:.6}
.focus-head{margin:0 0 0.8rem; font-family:var(--serif); font-weight:500; font-size:2.2rem; line-height:1.15; letter-spacing:-0.01em; color:var(--ink)}
.focus-head .fcode{color:var(--accent); font-style:italic; font-weight:500; margin-right:0.5rem}
.focus-meta{
  display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; color:var(--ink-muted);
  font-family:var(--sans); font-size:0.78rem; margin-bottom:1.6rem;
  padding-bottom:1rem; border-bottom:1px solid var(--rule);
}
.chip{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--sans); font-size:0.72rem; font-weight:500;
  border:1px solid var(--rule); border-radius:0; padding:0.18rem 0.55rem; color:var(--ink-muted); background:var(--rule-soft);
}
.chip .k{color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; font-size:0.62rem; font-weight:600}

/* ---------- Synopsis (three columns) ---------- */
.synopsis-overline{display:grid; grid-template-columns:1fr 2.15fr; gap:0; margin-bottom:0.45rem}
.synopsis-overline .ov{min-width:0}
.synopsis-overline .ov-ant{
  font-family:var(--sans); font-size:0.65rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-soft);
  display:flex; align-items:center; gap:10px; padding-left:2px;
}
.synopsis-overline .ov-ant::before{content:""; width:14px; height:1px; background:var(--rule)}
.synopsis-overline .ov-ant::after{content:""; flex:1; height:1px; background:var(--rule)}
.synopsis{
  display:grid; grid-template-columns:1fr 1.15fr 1fr; gap:0;
  border:1px solid var(--rule); border-top:2px solid var(--accent); border-radius:0; overflow:hidden;
  background:var(--surface-raised); box-shadow:var(--shadow-lg);
}
.col{min-width:0; border-left:1px solid var(--rule)}
.col:first-child{border-left:none}
.col-a, .col-b{box-shadow:none}
.col-q{background:linear-gradient(to right,rgba(166,133,74,0.06),rgba(166,133,74,0.02)); border-left:3px solid var(--gold)}
.col-head{
  font-family:var(--sans); font-size:0.68rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase;
  padding:0.85rem 1.1rem; border-bottom:1px solid var(--rule-soft); display:flex; align-items:center; gap:8px;
  position:sticky; top:0; background:var(--surface-raised);
}
.col-head .swatch{width:6px; height:6px; border-radius:50%; flex:none}
.col-q .col-head{background:transparent; color:var(--gold)}
.col-a .col-head{color:var(--ink-muted)}
.col-b .col-head{color:var(--trad-biblical)}
.col-body{padding:1rem 1.1rem 1.25rem}
.sep-li{font-style:italic; opacity:.75}

/* Qur'an verses (ini .quran-block .verse) */
.verse{margin-bottom:0.75rem}
.verse:last-child{margin-bottom:0}
.vref{font-family:var(--mono); font-size:0.75rem; color:var(--gold); font-weight:500; margin-bottom:0.1rem}
.vtext{font-family:var(--serif); font-size:1.08rem; line-height:1.6; color:var(--ink)}
.surah-label{font-family:var(--sans); font-size:0.68rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); margin:0 0 0.8rem}
.unit-note{font-family:var(--sans); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-top:0.8rem; padding-top:0.7rem; border-top:1px dotted var(--rule)}

/* Antecedent / biblical cards (ini .source-card) */
.card{
  border:1px solid var(--rule); border-radius:0; margin-bottom:0.75rem; background:var(--surface);
  overflow:hidden; transition:border-color .15s, box-shadow .15s; position:relative;
}
.card:last-child{margin-bottom:0}
.card:hover{border-color:var(--ink-soft)}
.card[data-open="true"]{background:var(--surface-raised); box-shadow:var(--shadow-sm)}
.card.j{border-left:4px solid var(--trad-jewish)}
.card.c{border-left:4px solid var(--trad-christian)}
.card.bib{border-left:4px solid var(--trad-biblical)}
.card.u{border-left:4px solid var(--rule)}
.tile-head{
  display:flex; align-items:flex-start; gap:0.85rem; width:100%; text-align:left;
  background:none; border:none; cursor:pointer; font-family:var(--sans); color:var(--ink);
  padding:0.85rem 1rem; transition:background .12s;
}
.tile-head[disabled]{cursor:default}
.tile-head:hover:not([disabled]){background:var(--rule-soft)}
.tile-head:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.tile-main{min-width:0; flex:1}
.card-title{font-family:var(--serif); font-size:1.12rem; font-weight:600; line-height:1.3; margin-bottom:0.15rem; color:var(--ink)}
.card-trad{display:block; font-family:var(--sans); font-size:0.62rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:0.3rem}
.card.j .card-trad{color:var(--trad-jewish)}
.card.c .card-trad{color:var(--trad-christian)}
.card.bib .card-trad{color:var(--trad-biblical)}
.tile-teaser{display:block; font-family:var(--serif); font-style:italic; font-size:0.98rem; color:var(--ink-muted); margin-top:0.2rem; line-height:1.4}
.chev{flex:none; width:14px; height:14px; margin-top:4px; position:relative; color:var(--ink-soft); transition:transform .2s ease}
.chev::before{content:""; position:absolute; left:3px; top:1px; width:6px; height:6px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(-45deg)}
.card[data-open="true"] .chev{transform:rotate(90deg); color:var(--accent)}
.tile-body{display:grid; grid-template-rows:0fr; transition:grid-template-rows .2s ease; border-top:1px solid transparent}
.tile-body > .fields{overflow:hidden}
.card[data-open="true"] .tile-body{grid-template-rows:1fr; border-top-color:var(--rule-soft)}
.fields{display:flex; flex-direction:column; gap:0; padding:0 1rem}
.card[data-open="true"] .fields{padding:0.35rem 1rem 0.75rem}
.field{
  display:grid; grid-template-columns:132px 1fr; gap:0.85rem; padding:0.45rem 0;
  border-bottom:1px dotted var(--rule-soft); align-items:baseline;
}
.field:last-child{border-bottom:0}
.field .fk{
  font-family:var(--sans); font-size:0.64rem; font-weight:600; color:var(--ink-soft);
  text-transform:uppercase; letter-spacing:0.04em; padding-top:0.1rem; overflow-wrap:break-word; hyphens:auto;
}
.field .fv{min-width:0; overflow-wrap:anywhere; font-family:var(--serif); font-size:1rem; line-height:1.5; color:var(--ink)}
.field .fv a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-soft)}
.field .fv a:hover{border-bottom-color:var(--accent)}
.card.c .field .fv a, .card.bib .field .fv a{color:var(--accent)}
@media (max-width:560px){ .field{grid-template-columns:1fr; gap:0.15rem} }
.empty-col{padding:1.6rem 1.1rem; color:var(--ink-soft); font-size:0.98rem; font-style:italic; font-family:var(--serif)}

/* Motif boxes (ini .focus card) */
.motif-group-label{
  display:flex; align-items:baseline; margin:2.5rem 0 1.1rem; padding-bottom:0.5rem;
  border-bottom:1px solid var(--rule-soft); font-family:var(--serif); font-size:1.6rem;
  font-weight:500; font-style:italic; color:var(--ink); line-height:1.1;
}
.motif-group-label span{background:var(--highlight); padding:0.1rem 0.7rem}
.motif-group-label:first-of-type{margin-top:0.25rem}
.motif-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:1rem; margin-bottom:0.5rem}
.motif-box{
  text-align:left; background:var(--surface-raised); border:1px solid var(--rule); border-radius:0;
  padding:1rem 1.1rem; cursor:pointer; display:flex; flex-direction:column; gap:0.35rem; min-height:118px;
  font-family:var(--serif); color:var(--ink); box-shadow:var(--shadow-sm);
  transition:all .18s cubic-bezier(.2,.8,.2,1);
}
.motif-box:hover{border-color:var(--ink-soft); box-shadow:var(--shadow-md); transform:translateY(-1px)}
.motif-box:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mb-topic{font-family:var(--sans); font-size:0.66rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); line-height:1.3}
.mb-title{font-family:var(--serif); font-size:1.12rem; font-weight:600; line-height:1.25; flex:1; color:var(--ink)}
.mb-code{font-family:var(--mono); font-size:0.72rem; font-style:normal; font-weight:500; color:var(--gold); letter-spacing:0.04em; margin-right:0.4rem}
.mb-counts{display:flex; flex-wrap:wrap; gap:0.3rem; font-family:var(--sans); font-size:0.7rem; font-weight:500; color:var(--ink-muted); margin-top:auto; padding-top:0.3rem}
.mb-c{display:inline-flex; align-items:center; gap:5px; padding:0.15rem 0.5rem; background:var(--rule-soft); border:1px solid transparent; line-height:1.4}
.mb-counts .d{width:6px; height:6px; border-radius:50%; flex:none}
.d.j{background:var(--trad-jewish)} .d.c{background:var(--trad-christian)} .d.b{background:var(--trad-biblical)}
.mb-c:has(.d.j){background:rgba(91,60,17,0.08); color:var(--trad-jewish); border-color:rgba(91,60,17,0.2)}
.mb-c:has(.d.c){background:rgba(78,65,135,0.08); color:var(--trad-christian); border-color:rgba(78,65,135,0.2)}
.mb-c:has(.d.b){background:rgba(58,90,64,0.1); color:var(--trad-biblical); border-color:rgba(58,90,64,0.2)}
#backBtn{margin:0 0 4px}

/* ---------- Landing / loader ---------- */
.placeholder{max-width:680px; margin:60px auto; text-align:center; padding:0 24px}
.placeholder h1{font-family:var(--serif); font-weight:500; font-size:2.4rem; letter-spacing:-0.01em; margin:0 0 10px; line-height:1.15}
.placeholder p{color:var(--ink-muted); font-size:1.05rem; margin:0 auto 18px; max-width:560px}
.dropzone{
  border:1px dashed var(--rule); border-radius:0; padding:34px 24px; background:var(--surface-raised);
  cursor:pointer; box-shadow:var(--shadow-sm); transition:all .15s;
}
.dropzone:hover,.dropzone.drag{border-color:var(--accent); background:var(--surface); box-shadow:var(--shadow-md)}
.dropzone strong{display:block; font-family:var(--serif); font-weight:600; font-size:1.3rem; margin-bottom:4px}
.dropzone span{color:var(--ink-muted); font-family:var(--sans); font-size:0.8rem}
.serve-tip{
  margin-top:20px; font-family:var(--sans); font-size:0.8rem; color:var(--ink-muted); background:var(--surface);
  border:1px solid var(--rule); border-left:3px solid var(--gold); border-radius:0; padding:13px 16px; text-align:left;
}
.serve-tip code{font-family:var(--mono); background:var(--rule-soft); padding:1px 6px; border-radius:0; font-size:0.75rem}
.spinner{width:26px; height:26px; border:2px solid var(--rule); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{color:var(--accent); font-family:var(--sans); font-size:0.82rem; margin-top:14px}

/* Legend (ini .legend) */
.legend{
  display:flex; flex-wrap:wrap; gap:0.6rem 1.25rem; margin:1.5rem 0 0; padding:0.85rem 1.1rem;
  background:var(--surface); border:1px solid var(--rule);
  font-family:var(--sans); font-size:0.75rem; color:var(--ink-muted); align-items:center;
}
.legend .li{display:inline-flex; align-items:center; gap:0.4rem}
.legend .sw{width:10px; height:10px; border-radius:50%}

.hint{color:var(--ink-muted); font-size:1.02rem; max-width:620px; line-height:1.55}
.hint b{color:var(--ink); font-weight:600}
code{font-family:var(--mono); font-size:0.85em}

.menu-toggle{display:none}

@media (max-width:900px){
  .shell{flex-direction:column}
  aside{
    width:100%; max-height:55vh; position:fixed; bottom:0; left:0; right:0; z-index:50;
    border-right:none; border-top:1px solid var(--rule);
    transform:translateY(100%); transition:transform .25s cubic-bezier(.2,.8,.2,1); box-shadow:var(--shadow-lg);
  }
  aside.open{transform:translateY(0)}
  .menu-toggle{display:inline-flex}
  .synopsis{grid-template-columns:1fr}
  .synopsis-overline{display:none}
  .col{border-left:none; border-top:1px solid var(--rule)}
  .col:first-child{border-top:none}
  .col-q{border-left:3px solid var(--gold)}
  .search input{width:150px}
  .tagline{display:none}
  .wrap{padding:1.5rem 1.25rem 3rem}
  .focus-head{font-size:1.9rem}
  .motif-group-label{font-size:1.4rem}
  .motif-grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:0.75rem}
  .motif-box{padding:0.85rem 0.9rem}
}
@media (max-width:560px){
  .head-row{flex-wrap:wrap; gap:10px}
  .search input{width:130px}
  .wrap{padding:1.25rem 1rem 80px}
  .focus-head{font-size:1.7rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important; transition:none!important}
}

/* ---------- Site navigation (ini .topbar nav) ---------- */
.site-nav{display:flex; align-items:stretch; gap:1.6rem; padding:0 1.5rem; border-top:1px solid var(--rule-soft); font-family:var(--sans); font-size:0.78rem}
.site-nav > a, .site-nav .dd > button{
  display:inline-flex; align-items:center; gap:0.35rem; padding:0.6rem 0 0.5rem;
  color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.08em; font-weight:500;
  text-decoration:none; background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  font-family:var(--sans); font-size:0.78rem; transition:color .12s, border-color .12s;
}
.site-nav > a:hover, .site-nav .dd > button:hover{color:var(--ink); border-bottom-color:var(--ink)}
.site-nav .current, .site-nav .dd.current > button{color:var(--ink); border-bottom-color:var(--accent)}
.site-nav > a:focus-visible, .site-nav .dd > button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.site-nav .push{margin-left:auto}
.dd{position:relative; display:flex}
.dd .caret{font-size:0.6rem; color:var(--ink-soft); transition:transform .2s}
.dd.open .caret{transform:rotate(180deg)}
.dd-menu{
  display:none; position:absolute; top:100%; left:-0.9rem; min-width:250px; z-index:60;
  background:var(--surface-raised); border:1px solid var(--rule); border-top:2px solid var(--accent);
  box-shadow:var(--shadow-lg); padding:0.4rem 0;
}
.dd.open .dd-menu, .dd:focus-within .dd-menu{display:block}
@media (hover:hover){ .dd:hover .dd-menu{display:block} }
.dd-menu a{
  display:block; padding:0.45rem 1rem; color:var(--ink-muted); text-decoration:none;
  font-family:var(--sans); font-size:0.82rem; font-weight:500; border-left:2px solid transparent;
}
.dd-menu a:hover{background:var(--rule-soft); color:var(--ink); border-left-color:var(--accent)}
.dd-menu a.sub{padding-left:2rem; font-weight:400; font-size:0.78rem}
.dd-menu .dd-sep{height:1px; background:var(--rule-soft); margin:0.35rem 0}
.dd-menu .soon{font-family:var(--mono); font-size:0.62rem; color:var(--gold); text-transform:uppercase; letter-spacing:0.06em; margin-left:0.4rem}

/* ---------- Static pages ---------- */
.page{max-width:860px}
.page-section{margin:2.5rem 0 0; scroll-margin-top:1.25rem}
.page-section:first-of-type{margin-top:1.5rem}
.page-section > h2{
  display:flex; align-items:baseline; margin:0 0 1.1rem; padding-bottom:0.5rem; border-bottom:1px solid var(--rule-soft);
  font-family:var(--serif); font-size:1.6rem; font-weight:500; font-style:italic; line-height:1.1;
}
.page-section > h2 span{background:var(--highlight); padding:0.1rem 0.7rem}
.page-section h3{font-family:var(--serif); font-size:1.3rem; font-weight:600; margin:1.6rem 0 0.6rem; scroll-margin-top:1.25rem}
.page-section h3:first-of-type{margin-top:0.4rem}
.placeholder-box{
  border:1px dashed var(--rule); background:var(--surface); padding:1rem 1.2rem;
  color:var(--ink-soft); font-style:italic; font-size:1.02rem;
}
.soon-tag{
  display:inline-block; font-family:var(--mono); font-size:0.66rem; text-transform:uppercase; letter-spacing:0.08em;
  color:var(--gold); font-style:normal; border:1px solid rgba(166,133,74,0.4); background:rgba(166,133,74,0.08); padding:0.12rem 0.5rem; margin-left:0.6rem; vertical-align:middle;
}
.library-card{
  display:flex; align-items:center; gap:1rem; flex-wrap:wrap; padding:1.1rem 1.25rem;
  background:var(--surface-raised); border:1px solid var(--rule); border-left:4px solid var(--gold); box-shadow:var(--shadow-sm);
}
.library-card p{margin:0; flex:1; min-width:220px; color:var(--ink-muted)}
.link-btn{
  font-family:var(--sans); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.08em; font-weight:500;
  padding:0.5rem 0.9rem; border:1px solid var(--accent); color:var(--accent); text-decoration:none; white-space:nowrap; transition:all .15s;
}
.link-btn:hover{background:var(--accent); color:var(--paper)}
.site-list{list-style:none; margin:0; padding:0; border:1px solid var(--rule); background:var(--surface-raised); box-shadow:var(--shadow-sm)}
.site-list li{border-top:1px solid var(--rule-soft)}
.site-list li:first-child{border-top:0}
.site-list a{
  display:flex; align-items:baseline; gap:1rem; padding:0.7rem 1.1rem; text-decoration:none; color:var(--ink);
  transition:background .12s;
}
.site-list a:hover{background:var(--rule-soft)}
.site-list .nm{font-family:var(--serif); font-size:1.1rem; font-weight:600; flex:1}
.site-list .url{font-family:var(--mono); font-size:0.72rem; color:var(--accent); overflow-wrap:anywhere; text-align:right}
.site-list .ext{font-size:0.8rem; color:var(--ink-soft)}
@media (max-width:900px){
  .site-nav{gap:1.1rem; overflow-x:auto; padding:0 1rem}
  .dd-menu{position:fixed; top:auto; left:1rem; right:1rem; min-width:0}
  .site-list a{flex-direction:column; gap:0.1rem}
  .site-list .url{text-align:left}
}
</style>
</head>

<script>
"use strict";
const QURAN = window.QURAN || {};
const XLSX_FILE = "IQP_Database (Suha).xlsx";

/* ---------------- helpers ---------------- */
const PLACEHOLDERS = new Set(["n/a","na","tbd","tba","double check","?","p.?","—","-","none","null","x",""]);
function clean(v){
  if(v==null) return "";
  let s = String(v).replace(/\s+/g," ").trim();
  if(PLACEHOLDERS.has(s.toLowerCase())) return "";
  return s;
}
function normHeader(h){ return String(h).toLowerCase().replace(/[’‘‛`´]/g,"'").replace(/\s+/g," ").trim(); }
function looseHeader(h){ return normHeader(h).replace(/\([^)]*\)/g,"").replace(/[^a-z0-9]/g,""); }
// known synonyms for the few structural fields, so renamed headings still resolve
const HEADER_ALIASES = {
  "quranicreferences":["quranicreference","quranicref","quranreferences","quranref","verse","verses","ayah","ayat"],
  "quranicunit":["quranunit","narrativeunit","pericope"],
  "broadtopic":["topic","theme","narrative"],
  "subtopic":["subtheme","sub"],
  "focuspoint":["focus","motif","focusmotif"],
  "antecedent":["antecedenttitle","source","sourcetitle"],
  "countertradition":["counter","biblicalcountertradition","biblicalcounter","biblical"],
  "countertraditionunit":["counterunit","biblicalunit"],
  "content":["description","summary","gloss"]
};
// build normalized-key row accessor with loose + alias fallback
function rowGetter(row){
  const map = {}, loose = {};
  for(const k in row){ map[normHeader(k)] = row[k]; loose[looseHeader(k)] = row[k]; }
  return (name)=>{
    let v = map[normHeader(name)];
    if(v==null || v===""){ v = loose[looseHeader(name)]; }
    if(v==null || v===""){
      const aliases = HEADER_ALIASES[looseHeader(name)];
      if(aliases) for(const a of aliases){ if(loose[a]!=null && loose[a]!==""){ v = loose[a]; break; } }
    }
    return clean(v);
  };
}
function normDash(s){ return String(s).replace(/[\u2010\u2011\u2012\u2013\u2014\u2015\u2212]/g,"-"); }

// parse "12:4–5; 12:6" -> [{s,v} ...] expanded
function parseRefs(raw){
  const out=[]; if(!raw) return out;
  normDash(raw).split(/[;,]/).forEach(part=>{
    const m = part.trim().match(/^(\d+):(\d+)(?:-(\d+))?$/);
    if(!m) return;
    const s=+m[1], a=+m[2], b=m[3]?+m[3]:a;
    for(let v=a; v<=b && v-a<60; v++) out.push({s,v});
  });
  // dedupe preserve order
  const seen=new Set(), res=[];
  out.forEach(r=>{const k=r.s+":"+r.v; if(!seen.has(k)){seen.add(k); res.push(r);}});
  return res;
}
function surahName(s){ const q=QURAN[String(s)]; return q ? (q.arabic||q.title||("Surah "+s)) : ("Surah "+s); }
function surahTitleEn(s){ const q=QURAN[String(s)]; return q ? (q.title||"") : ""; }
function verseText(s,v){ const q=QURAN[String(s)]; return q && q.verses ? (q.verses[String(v)]||"") : ""; }

// strip trailing locator to get the "work" name for grouping
function workName(antecedent){
  let s = antecedent.trim();
  s = s.replace(/\s*\([^()]*\)\s*$/,"").trim();       // drop trailing (…)
  const toks = s.split(/\s+/);
  while(toks.length>1 && /^[\d]/.test(toks[toks.length-1])) toks.pop(); // drop trailing locator tokens
  let w = toks.join(" ").replace(/[\s,;:.]+$/,"").trim();
  return w || s;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// linkify a citation that may contain a URL
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s);]+)(?=[);.\s]|$)/g,'<a href="$1" target="_blank" rel="noopener">link</a>');
}

/* ---------------- model ---------------- */
let MODEL = null; // {nodes:[], byKey:{}, topics:[], surahs:[], works:[]}

function tradFromSheetName(name){
  const n = name.toLowerCase();
  if(n.includes("christian")) return "Christian";
  if(n.includes("jewish")) return "Jewish";
  return "Biblical";
}
// column P "Broad Literary Category" -> Jewish | Christian | Biblical ("" if blank/unrecognised); tolerant of typos like "Exra-Biblical"
function tradFromCategory(p){
  const s = String(p||"").toLowerCase().trim();
  if(!s) return "";
  if(/^bibl/.test(s)) return "Biblical";
  if(s.includes("jewish")) return "Jewish";       // incl. "Jewish, or Christian interpolation"
  if(s.includes("christian")) return "Christian";
  return "";
}

function buildModel(wb){
  const nodes = new Map(); // key -> node
  function nodeFor(topic, focus){
    const key = topic+"\u0000"+focus;
    if(!nodes.has(key)) nodes.set(key,{
      key, topic, focus, subtopic:"", longFocus:"", quranUnit:"",
      refs:[], refSet:new Set(), antecedents:[], bible:[]
    });
    return nodes.get(key);
  }
  function addRefs(node, raw){
    parseRefs(raw).forEach(r=>{ const k=r.s+":"+r.v; if(!node.refSet.has(k)){ node.refSet.add(k); node.refs.push(r);} });
  }

  // columns already represented by node context / other columns — not repeated inside a tile
  const HIDE = ["literary work or genre","broad literary category","owner"];
  const SKIP = new Set([
    "timestamp","broad topic","subtopic","focus point","long focus point",
    "qur'anic reference(s)","qur'anic unit","antecedent", ...HIDE
  ].map(normHeader));
  const SKIP_BIBLE = new Set([
    "timestamp","broad topic","subtopic","focus point","long focus point",
    "qur'anic reference(s)","qur'anic unit","antecedent",
    "biblical reference(s)","biblical unit","significance",
    "counter-tradition(s)","counter-tradition","counter-tradition unit", ...HIDE
  ].map(normHeader));

  // every populated cell in the row, in spreadsheet column order, minus the skip set
  function orderedFields(raw, headers, skip){
    const out = [];
    headers.forEach(h=>{
      const v = clean(raw[h]);
      if(!v) return;
      if(skip.has(normHeader(h))) return;
      out.push({ label: String(h).replace(/\s+/g," ").trim(), value: v });
    });
    return out;
  }

  wb.SheetNames.forEach(sheetName=>{
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, raw:false, defval:""});
    const headers = (grid[0]||[]).map(h=>String(h)).filter(h=>h.trim()!=="");
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {raw:false, defval:""});
    rows.forEach(raw=>{
      const G = rowGetter(raw);
      const topic = G("Broad Topic");
      const focus = G("Focus Point");
      if(!topic || !focus) return;
      const node = nodeFor(topic, focus);
      const sub = G("Subtopic"); if(sub && !node.subtopic) node.subtopic = sub;
      const unit = G("Qur'anic Unit"); if(unit && !node.quranUnit) node.quranUnit = unit;
      const lf = G("Long Focus Point"); if(lf){ (node.longCands = node.longCands||[]).push(lf); if(!node.longFocus) node.longFocus = lf; }
      addRefs(node, G("Qur'anic Reference(s)"));

      // category comes only from column P ("Broad Literary Category"); blank -> no label ("")
      const aTitle = G("Antecedent");
      const trad = tradFromCategory(G("Broad Literary Category"));

      if(trad==="Biblical" || (!trad && !aTitle)){
        const ref = G("Biblical Reference(s)") || G("Biblical Unit")
                 || G("Counter-Tradition(s)") || G("Counter-Tradition");
        const desc = G("Significance") || G("Content");
        if(!ref && !desc) return; // nothing to show
        node.bible.push({
          labelled: trad==="Biblical",
          ref: ref || "Biblical reference",
          teaser: desc || G("Literary Work or Genre"),
          fields: orderedFields(raw, headers, SKIP_BIBLE)
        });
      } else {
        const title = G("Antecedent");
        if(!title) return;
        node.antecedents.push({
          trad,
          title,
          work: workName(title),
          teaser: G("Literary Work or Genre") || G("Source Dating"),
          fields: orderedFields(raw, headers, SKIP)
        });
      }
    });
  });

  const list = [...nodes.values()].filter(n=> n.antecedents.length || n.bible.length );
  list.forEach((n,i)=> n.id = i); // stable numeric id for DOM lookups
  // sort refs
  list.forEach(n=> n.refs.sort((a,b)=> a.s-b.s || a.v-b.v));

  // focus code + label
  list.forEach(n=>{
    const m = n.focus.match(/^([A-Za-z]*\d+)\s*[:.]\s*(.*)$/);
    n.fcode = m ? m[1] : "";
    n.flabel = m ? m[2] : n.focus;
    // heading = long focus point (code prefix stripped); only trust a long title whose code matches this motif's
    n.ftitle = n.flabel;
    for(const lf of (n.longCands||[])){
      const lm = lf.trim().match(/^([A-Za-z]*\d+)\s*[:.]\s*(.*)$/);
      const code = lm ? lm[1] : "", text = (lm ? lm[2] : lf).trim();
      if(text && (!n.fcode || !code || code.toUpperCase()===n.fcode.toUpperCase())){ n.ftitle = text; break; }
    }
  });

  // ----- topics tree: topic -> subtopic('' bucket) -> nodes -----
  const topicMap = new Map();
  list.forEach(n=>{
    if(!topicMap.has(n.topic)) topicMap.set(n.topic, new Map());
    const sm = topicMap.get(n.topic);
    const sk = n.subtopic || "";
    if(!sm.has(sk)) sm.set(sk, []);
    sm.get(sk).push(n);
  });

  // ----- surah index -----
  const surahMap = new Map(); // s -> Set(nodeKey)
  list.forEach(n=> n.refs.forEach(r=>{
    if(!surahMap.has(r.s)) surahMap.set(r.s, new Set());
    surahMap.get(r.s).add(n);
  }));

  // ----- works index: trad -> work -> nodes -----
  const workMap = new Map(); // work -> {trad, nodes:Set}
  list.forEach(n=> n.antecedents.forEach(a=>{
    if(!workMap.has(a.work)) workMap.set(a.work, {work:a.work, trads:new Set(), nodes:new Set()});
    const w = workMap.get(a.work); w.trads.add(a.trad); w.nodes.add(n);
  }));

  return {
    nodes:list,
    byId:list,
    byKey:Object.fromEntries(list.map(n=>[n.key,n])),
    topicMap, surahMap, workMap
  };
}

/* ---------------- rendering ---------------- */
const browseEl = document.getElementById("browse");
const contentEl = document.getElementById("content");
let MODE = "surah";
let CURRENT = null; // current node key

function setStatus(kind, text){
  const dot=document.getElementById("statusDot"), t=document.getElementById("statusText");
  dot.className = "dot" + (kind==="live"?" live":kind==="err"?" err":"");
  t.textContent = text;
}

function collator(){ return new Intl.Collator(undefined,{numeric:true,sensitivity:"base"}); }

function renderSidebar(){
  const c = collator();
  let h = "";
  if(MODE==="surah"){
    h += `<div class="crumbtop">Surahs referenced</div>`;
    const surahs = [...MODEL.surahMap.keys()].sort((a,b)=>a-b);
    surahs.forEach(s=>{
      const cnt = MODEL.surahMap.get(s).size;
      const en = surahTitleEn(s);
      h += `<button class="nav-item" data-surah="${s}">
        <span class="lead">${s}</span>
        <span>${esc(surahName(s))}${en?` · <span style="color:var(--muted)">${esc(en)}</span>`:""}</span>
        <span class="count">${cnt}</span></button>`;
    });
  }
  else if(MODE==="topic"){
    const topics = [...MODEL.topicMap.keys()].sort(c.compare);
    topics.forEach(topic=>{
      h += `<div class="nav-group">${esc(topic)}</div>`;
      const sm = MODEL.topicMap.get(topic);
      const subs = [...sm.keys()].sort((a,b)=> a===""? -1 : b===""?1 : c.compare(a,b));
      subs.forEach(sub=>{
        if(sub) h += `<div class="nav-sub">${esc(sub)}</div>`;
        sm.get(sub).slice().sort((a,b)=>c.compare(a.focus,b.focus)).forEach(n=>{
          h += navNode(n);
        });
      });
    });
  }
  else if(MODE==="antecedent"){
    const works = [...MODEL.workMap.values()];
    const byTrad = {Jewish:[], Christian:[]};
    works.forEach(w=>{
      const t = w.trads.has("Jewish")&&!w.trads.has("Christian") ? "Jewish"
              : w.trads.has("Christian")&&!w.trads.has("Jewish") ? "Christian"
              : !w.trads.has("Jewish")&&!w.trads.has("Christian") ? "Other"
              : "Jewish"; // mixed -> list under Jewish primarily
      (byTrad[t]||(byTrad[t]=[])).push(w);
    });
    [["Jewish","Extra-Biblical Jewish"],["Christian","Extra-Biblical Christian"],["Other","Other sources"]].forEach(([t,label])=>{
      const arr=(byTrad[t]||[]).sort((a,b)=>c.compare(a.work,b.work));
      if(!arr.length) return;
      h += `<div class="nav-group" style="color:var(--${t.toLowerCase()})">${esc(label)}</div>`;
      arr.forEach(w=>{
        h += `<button class="nav-item" data-work="${esc(w.work)}">
          <span>${esc(w.work)}</span>
          <span class="count">${w.nodes.size}</span></button>`;
      });
    });
  }
  browseEl.innerHTML = h;
}
function navNode(n){
  return `<button class="nav-item" data-id="${n.id}" aria-current="${CURRENT===n.id}">
    <span class="lead">${esc(n.fcode||"·")}</span>
    <span>${esc(n.flabel)}</span>
    <span class="count">${n.antecedents.length+n.bible.length}</span></button>`;
}

let lastBrowse = null; // re-renders the boxes view we came from (for the Back button)

function motifBox(n){
  const j = n.antecedents.filter(x=>x.trad==="Jewish").length;
  const c = n.antecedents.filter(x=>x.trad==="Christian").length;
  const b = n.bible.length;
  return `<button class="motif-box" data-id="${n.id}">
    ${n.subtopic?`<span class="mb-topic">${esc(n.subtopic)}</span>`:""}
    <span class="mb-title">${n.fcode?`<span class="mb-code">${esc(n.fcode)}</span>`:""}${esc(n.flabel)}</span>
    <span class="mb-counts">
      ${j?`<span class="mb-c"><i class="d j"></i>${j} Jewish</span>`:""}
      ${c?`<span class="mb-c"><i class="d c"></i>${c} Christian</span>`:""}
      ${b?`<span class="mb-c"><i class="d b"></i>${b} Biblical</span>`:""}
    </span>
  </button>`;
}

function boxesGrid(nodes){
  const c=collator();
  nodes = nodes.slice().sort((a,b)=> c.compare(a.topic,b.topic) || c.compare(a.subtopic,b.subtopic) || c.compare(a.focus,b.focus));
  let h="", lastTopic=null, open=false;
  nodes.forEach(n=>{
    if(n.topic!==lastTopic){
      if(open) h+=`</div>`;
      h += `<div class="motif-group-label"><span>${esc(n.topic)}</span></div><div class="motif-grid">`;
      lastTopic=n.topic; open=true;
    }
    h += motifBox(n);
  });
  if(open) h+=`</div>`;
  return h;
}

function renderBoxes(title, crumb, nodes){
  lastBrowse = ()=>renderBoxes(title, crumb, nodes);
  contentEl.innerHTML = `<div class="crumb">${crumb}</div>
    <h1 class="focus-head" style="font-size:24px;margin-bottom:18px">${esc(title)}</h1>
    ${boxesGrid(nodes)}`;
  main.scrollTop=0;
  closeDrawer();
}

function renderNode(id){
  id = +id;
  const n = MODEL.byId[id];
  if(!n){ contentEl.innerHTML = `<p class="hint">That focus point isn't in the current data.</p>`; return; }
  CURRENT = id;

  const crumb = `<button class="back" id="backBtn" type="button">‹ Back to motifs</button>
    <div class="crumb"><b>${esc(n.topic)}</b>${n.subtopic?`<span class="sep">›</span>${esc(n.subtopic)}`:""}<span class="sep">›</span>${esc(n.focus)}</div>`;

  // column 1 — Qur'an
  let q = "";
  const bySurah = new Map();
  n.refs.forEach(r=>{ if(!bySurah.has(r.s)) bySurah.set(r.s,[]); bySurah.get(r.s).push(r.v); });
  if(bySurah.size){
    [...bySurah.keys()].sort((a,b)=>a-b).forEach(s=>{
      q += `<div class="surah-label">Surah ${s} — ${esc(surahName(s))}${surahTitleEn(s)?` · ${esc(surahTitleEn(s))}`:""}</div>`;
      bySurah.get(s).forEach(v=>{
        const t = verseText(s,v);
        q += `<div class="verse"><div class="vref">${s}:${v}</div><div class="vtext">${t?esc(t):'<span style="color:var(--muted);font-style:italic">verse text unavailable</span>'}</div></div>`;
      });
    });
    if(n.quranUnit) q += `<div class="unit-note">Narrative unit: ${esc(normDash(n.quranUnit))}</div>`;
  } else {
    q = `<div class="empty-col">No Qur'anic reference recorded.</div>`;
  }

  // column 2 — antecedents (Jewish + Christian), each an expandable tile
  let a = "";
  const jcount = n.antecedents.filter(x=>x.trad==="Jewish").length;
  const ccount = n.antecedents.filter(x=>x.trad==="Christian").length;
  if(n.antecedents.length){
    const order = {Jewish:0, Christian:1, "":2};
    n.antecedents.slice().sort((x,y)=> (order[x.trad]-order[y.trad]) ).forEach(ant=>{
      a += tile(
        ant.trad==="Jewish"?"j":ant.trad==="Christian"?"c":"u",
        ant.trad==="Jewish"?"Extra-Biblical Jewish":ant.trad==="Christian"?"Extra-Biblical Christian":"",
        ant.title, ant.teaser, ant.fields
      );
    });
  } else {
    a = `<div class="empty-col">No extra-biblical antecedent recorded for this focus point.</div>`;
  }

  // column 3 — biblical counter-tradition (sheet 1), part of the same antecedent record
  let b = "";
  if(n.bible.length){
    n.bible.forEach(bib=> b += tile("bib", bib.labelled?"The Bible":"", bib.ref, bib.teaser, bib.fields));
  } else {
    b = `<div class="empty-col">Nothing from the Bible recorded for this motif.</div>`;
  }

  contentEl.innerHTML = `
    ${crumb}
    <h1 class="focus-head">${n.fcode?`<span class="fcode">${esc(n.fcode)}</span>`:""}${esc(n.ftitle)}</h1>
    <div class="focus-meta">
      ${n.refs.length?`<span class="chip"><span class="k">Qur'an</span> ${n.refs.length} verse${n.refs.length>1?"s":""}</span>`:""}
      ${jcount?`<span class="chip"><span class="k">Jewish</span> ${jcount}</span>`:""}
      ${ccount?`<span class="chip"><span class="k">Christian</span> ${ccount}</span>`:""}
      ${n.bible.length?`<span class="chip"><span class="k">The Bible</span> ${n.bible.length}</span>`:""}
    </div>
    <div class="synopsis-overline" aria-hidden="true">
      <div class="ov ov-q"></div>
      <div class="ov ov-ant">The antecedent</div>
    </div>
    <div class="synopsis">
      <div class="col col-q"><div class="col-head"><span class="swatch" style="background:var(--quran)"></span>Qur'an · MWK translation</div><div class="col-body">${q}</div></div>
      <div class="col col-a"><div class="col-head"><span class="swatch" style="background:linear-gradient(90deg,var(--jewish),var(--christian))"></span>Extra-Biblical Traditions</div><div class="col-body">${a}</div></div>
      <div class="col col-b"><div class="col-head"><span class="swatch" style="background:var(--bible)"></span>The Bible</div><div class="col-body">${b}</div></div>
    </div>
    <div class="legend">
      <span class="li"><span class="sw" style="background:var(--jewish)"></span>Extra-biblical Jewish</span>
      <span class="li"><span class="sw" style="background:var(--christian)"></span>Extra-biblical Christian</span>
      <span class="li sep-li">the two antecedent types</span>
      <span class="li"><span class="sw" style="background:var(--bible)"></span>The Bible <span style="opacity:.7">— the scriptural baseline they diverge from</span></span>
    </div>`;

  // sync sidebar highlight
  browseEl.querySelectorAll(".nav-item[data-id]").forEach(el=>{
    el.setAttribute("aria-current", +el.getAttribute("data-id")===id);
  });
  main.scrollTop = 0;
  closeDrawer();
}

// an expandable source tile: collapsed shows tradition + title (+ teaser); click reveals all row fields
function tile(cls, tradLabel, title, teaser, fields){
  const hasFields = fields && fields.length;
  return `<div class="card ${cls}" data-open="false">
    <button type="button" class="tile-head" aria-expanded="false"${hasFields?"":' disabled'}>
      <span class="tile-main">
        ${tradLabel?`<span class="card-trad">${esc(tradLabel)}</span>`:""}
        <span class="card-title">${esc(title)}</span>
        ${teaser?`<span class="tile-teaser">${esc(teaser)}</span>`:""}
      </span>
      ${hasFields?`<span class="chev" aria-hidden="true"></span>`:""}
    </button>
    ${hasFields?`<div class="tile-body"><div class="fields">${fieldsList(fields)}</div></div>`:""}
  </div>`;
}

function fieldsList(fields){
  return fields.map(f=>{
    const v = esc(f.value).replace(/(https?:\/\/[^\s);]+)(?=[);.\s]|$)/g,
      '<a href="$1" target="_blank" rel="noopener">$1</a>');
    return `<div class="field"><div class="fk">${esc(f.label)}</div><div class="fv">${v}</div></div>`;
  }).join("");
}

// search
const searchEl=document.getElementById("search");
let searchTimer=null;
searchEl.addEventListener("input",()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(runSearch,140);
});
function runSearch(){
  const qraw=searchEl.value.trim();
  if(!qraw){ renderDefault(); return; }
  const q=qraw.toLowerCase();
  const verseMatch=normDash(qraw).match(/^(\d+):(\d+)$/);
  const fieldText=src=> (src.fields||[]).map(f=>f.value).join(" ").toLowerCase();
  const hits=MODEL.nodes.filter(n=>{
    if(n.topic.toLowerCase().includes(q)) return true;
    if(n.focus.toLowerCase().includes(q)) return true;
    if(n.subtopic.toLowerCase().includes(q)) return true;
    if(n.antecedents.some(a=>a.title.toLowerCase().includes(q)||a.work.toLowerCase().includes(q)||fieldText(a).includes(q))) return true;
    if(n.bible.some(b=>(b.ref+" "+(b.teaser||"")).toLowerCase().includes(q)||fieldText(b).includes(q))) return true;
    if(verseMatch && n.refs.some(r=>r.s===+verseMatch[1]&&r.v===+verseMatch[2])) return true;
    return false;
  });
  lastBrowse = runSearch;
  let h=`<div class="crumb"><b>Search</b><span class="sep">›</span>"${esc(qraw)}"</div>
    <h1 class="focus-head" style="font-size:24px">${hits.length} result${hits.length===1?"":"s"}</h1>`;
  if(!hits.length){
    h+=`<p class="hint" style="margin-top:10px">Nothing matched. Try a topic name (e.g. <b>Joseph</b>), a verse (e.g. <b>12:4</b>), or an antecedent (e.g. <b>Bereshit Rabbah</b>).</p>`;
  } else {
    h+=`<div style="height:18px"></div>${boxesGrid(hits)}`;
  }
  contentEl.innerHTML=h;
}

/* ---------------- data loading ---------------- */
function ingest(wb, source){
  MODEL = buildModel(wb);
  if(!MODEL.nodes.length){
    setStatus("err","No usable rows");
    contentEl.innerHTML=`<p class="hint">The spreadsheet loaded but no focus points with content were found. Check that the sheets contain <b>Broad Topic</b>, <b>Focus Point</b>, and <b>Antecedent</b> columns.</p>`;
    return;
  }
  setStatus("live", source+" · "+MODEL.nodes.length+" focus points");
  CURRENT=null;
  renderSidebar();
  if(!route()) renderDefault();
}

function loadEmbedded(){
  if(!window.IQP_EMBEDDED_XLSX) return false;
  try{
    const wb = XLSX.read(window.IQP_EMBEDDED_XLSX,{type:"base64"});
    ingest(wb, "Built-in");
    return true;
  }catch(err){ return false; }
}

async function loadFromFetch(){
  setStatus("","Reading spreadsheet…");
  const res = await fetch(XLSX_FILE, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf,{type:"array"});
  ingest(wb, "Live");
}

function showUpload(message){
  setStatus("err","Awaiting file");
  contentEl.innerHTML=`
    <div class="placeholder">
      <h1>Sources of the Qur'an</h1>
      <p>${message||"Open the database to begin."} Choose the Excel file below, or run a small web server in this folder so the page can read it automatically on every refresh.</p>
      <div class="dropzone" id="dz">
        <strong>Choose <code style="font-family:var(--mono);font-size:13px">${XLSX_FILE}</code></strong>
        <span>Click to browse, or drop the .xlsx here</span>
      </div>
      <div class="serve-tip">
        <b>Tip — make updates appear automatically.</b><br>
        In a terminal, from this folder, run <code>python3 -m http.server 8000</code> then open
        <code>http://localhost:8000/</code>. After that, editing the spreadsheet and refreshing the page is enough — no re-selecting the file.
      </div>
    </div>`;
  const dz=document.getElementById("dz");
  dz.addEventListener("click",()=>fileInput.click());
  ["dragover","dragenter"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("drag");}));
  ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("drag");}));
  dz.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f) readFile(f); });
}

const fileInput=document.getElementById("fileInput");
fileInput.addEventListener("change",e=>{ const f=e.target.files[0]; if(f) readFile(f); });
function readFile(file){
  setStatus("","Reading "+file.name+"…");
  const fr=new FileReader();
  fr.onload=()=>{ try{ const wb=XLSX.read(new Uint8Array(fr.result),{type:"array"}); ingest(wb,"Uploaded"); }
    catch(err){ setStatus("err","Read failed"); showUpload("That file couldn't be read as .xlsx."); } };
  fr.onerror=()=>{ setStatus("err","Read failed"); showUpload("The file couldn't be opened."); };
  fr.readAsArrayBuffer(file);
}

document.getElementById("reload").addEventListener("click",()=>{
  loadFromFetch().catch(()=> fileInput.click());
});
